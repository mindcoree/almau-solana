[package]
name = "vault"
version = "0.1.0"
description = "Недели 8–13 — vault, CPI swap и управление CLMM-позицией"
authors = ["Медиханов Тимур"]
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-account = "4"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
