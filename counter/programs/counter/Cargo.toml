[package]
name = "counter"
version = "0.1.0"
description = "Counter Program на Anchor — неделя 5"
authors = ["Медиханов Тимур"]
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
litesvm = "0.17.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
